<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>정보 학습 선택</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:#f6f8fc;color:#0f172a;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
    body{display:grid;place-items:center;padding:20px;overflow:auto}
    .info-select{width:min(560px,100%);border:1px solid #dbe3ef;border-radius:22px;background:#fff;padding:28px;box-shadow:0 12px 32px rgba(15,23,42,.08);text-align:center}
    .label{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:#eff6ff;color:#1d4ed8;padding:7px 12px;font-size:.88rem;font-weight:800}
    h1{margin-top:14px;font-size:clamp(1.55rem,4vw,2.15rem);line-height:1.25;letter-spacing:-.04em}
    p{margin-top:8px;color:#64748b;line-height:1.55;font-size:.96rem}
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
    .choice{display:flex;align-items:center;justify-content:center;gap:8px;min-height:74px;border:1px solid #dbe3ef;border-radius:16px;background:#f8fafc;color:#0f172a;text-decoration:none;font-size:1.12rem;font-weight:900;transition:background .15s ease,border-color .15s ease,transform .15s ease}
    .choice:hover,.choice:focus-visible{background:#eff6ff;border-color:#93c5fd;transform:translateY(-2px);outline:none}
    .choice.new:hover,.choice.new:focus-visible{background:#f0fdf4;border-color:#86efac}
    @media (max-width:520px){body{padding:14px}.info-select{padding:22px 16px}.choices{grid-template-columns:1fr}.choice{min-height:62px}}
  </style>
</head>
<body>
  <main class="info-select" aria-labelledby="infoTitle">
    <span class="label">💻 정보</span>
    <h1 id="infoTitle">파트를 선택하세요</h1>
    <p>중간고사 범위 또는 신규 범위 학습 자료로 이동합니다.</p>
    <p>두 범위 모두 기말고사 범위입니다.</p>

    <nav class="choices" aria-label="정보 파트 선택">
      <a class="choice midterm" href="./info_midterm.html">🧾 중간고사 범위</a>
      <a class="choice new" href="./info_new.html">✨ 신규 범위</a>
    </nav>
  </main>

  <script>
    document.querySelectorAll('.tab-btn').forEach((button) => {
      button.addEventListener('click', () => {
        const target = button.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach((tabButton) => {
          const active = tabButton === button;
          tabButton.classList.toggle('active', active);
          tabButton.setAttribute('aria-selected', String(active));
        });
        document.querySelectorAll('.tab-panel').forEach((panel) => {
          panel.classList.toggle('active', panel.id === target);
        });
      });
    });
  </script>
</body>
</html>
