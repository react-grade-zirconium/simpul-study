<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영어 학습 선택</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:#f6f8fc;color:#0f172a;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
    body{display:grid;place-items:center;padding:20px;overflow:auto}
    .english-select{width:min(680px,100%);border:1px solid #dbe3ef;border-radius:22px;background:#fff;padding:28px;box-shadow:0 12px 32px rgba(15,23,42,.08);text-align:center}
    .label{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:#eef2ff;color:#4338ca;padding:7px 12px;font-size:.88rem;font-weight:800}
    h1{margin-top:14px;font-size:clamp(1.55rem,4vw,2.15rem);line-height:1.25;letter-spacing:-.04em}
    p{margin-top:8px;color:#64748b;line-height:1.55;font-size:.96rem}
    .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
    .choice{display:flex;align-items:center;justify-content:center;gap:8px;min-height:74px;border:1px solid #dbe3ef;border-radius:16px;background:#f8fafc;color:#0f172a;text-decoration:none;font-size:1.18rem;font-weight:900;transition:background .15s ease,border-color .15s ease,transform .15s ease}
    .choice:hover,.choice:focus-visible{background:#eef2ff;border-color:#a5b4fc;transform:translateY(-2px);outline:none}
    .choice.supplement:hover,.choice.supplement:focus-visible{background:#f0fdf4;border-color:#86efac}
    .choice.vocab:hover,.choice.vocab:focus-visible{background:#fff7ed;border-color:#fdba74}
    @media (max-width:520px){body{padding:14px}.english-select{padding:22px 16px}.choices{grid-template-columns:1fr}.choice{min-height:62px}}
  </style>
</head>
<body>
  <main class="english-select" aria-labelledby="englishTitle">
    <span class="label">📝 영어</span>
    <h1 id="englishTitle">파트를 선택하세요</h1>
    <p>사회 탭처럼 원하는 영어 파트를 골라 학습 페이지로 이동할 수 있습니다.</p>

    <nav class="choices" aria-label="영어 파트 선택">
      <a class="choice main-text" href="./english_main_hub.html">📘 본문</a>
      <a class="choice supplement" href="./english_supplement.html">📗 부교재</a>
      <a class="choice vocab" href="./english_vocab_test.html">🧠 단어 test</a>
    </nav>
  </main>
</body>
</html>
