<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>물리 시뮬레이션</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;background:#f6f8fc;color:#0f172a;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;padding:20px}
    main{width:min(980px,100%);margin:0 auto;display:grid;gap:16px}
    .panel{border:1px solid #dbe3ef;border-radius:22px;background:#fff;padding:22px;box-shadow:0 12px 32px rgba(15,23,42,.08)}
    .back{display:inline-flex;margin-bottom:12px;color:#0e7490;text-decoration:none;font-weight:900}
    .label{display:inline-flex;border-radius:999px;background:#ecfeff;color:#0e7490;padding:7px 12px;font-size:.88rem;font-weight:900}
    h1{margin-top:14px;font-size:clamp(1.55rem,4vw,2.15rem);letter-spacing:-.04em}
    p{margin-top:8px;color:#64748b;line-height:1.55}
    .sim-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
    canvas{width:100%;height:auto;border:1px solid #dbe3ef;border-radius:18px;background:linear-gradient(#eff6ff 0 72%,#dcfce7 72%);display:block}
    .controls{display:grid;gap:14px}
    label{display:grid;gap:6px;font-weight:900;color:#334155}
    input[type="range"]{width:100%}
    output{color:#0e7490;font-weight:900}
    .buttons{display:flex;gap:8px;flex-wrap:wrap}
    button{border:1px solid #67e8f9;border-radius:12px;background:#ecfeff;color:#0e7490;padding:10px 14px;font:inherit;font-weight:900;cursor:pointer}
    button:hover,button:focus-visible{background:#cffafe;outline:none}
    .stat{border:1px solid #dbe3ef;border-radius:14px;background:#f8fafc;padding:12px;color:#334155;line-height:1.7;font-weight:800}
    @media (max-width:760px){.sim-grid{grid-template-columns:1fr}.controls{order:-1}}
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <a class="back" href="./science_physics_hub.html">← 물리 선택으로</a><br />
      <span class="label">🧪 물리 시뮬레이션</span>
      <h1>포물선 운동 시뮬레이션</h1>
      <p>초기 속력과 발사 각도를 바꿔 물체의 포물선 운동을 관찰하세요.</p>
    </section>

    <section class="panel sim-grid" aria-label="포물선 운동 시뮬레이션">
      <canvas id="simCanvas" width="900" height="520" aria-label="포물선 운동 캔버스"></canvas>
      <div class="controls">
        <label>초기 속력 <output id="speedValue">48 m/s</output><input id="speedInput" type="range" min="20" max="80" value="48" /></label>
        <label>발사 각도 <output id="angleValue">45°</output><input id="angleInput" type="range" min="15" max="75" value="45" /></label>
        <label>중력 가속도 <output id="gravityValue">9.8 m/s²</output><input id="gravityInput" type="range" min="2" max="16" step="0.1" value="9.8" /></label>
        <div class="buttons">
          <button id="playBtn" type="button">▶ 시작</button>
          <button id="resetBtn" type="button">↺ 초기화</button>
        </div>
        <div class="stat" id="statBox">비행 시간, 최고 높이, 수평 이동 거리가 여기에 표시됩니다.</div>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const speedInput = document.getElementById('speedInput');
    const angleInput = document.getElementById('angleInput');
    const gravityInput = document.getElementById('gravityInput');
    const speedValue = document.getElementById('speedValue');
    const angleValue = document.getElementById('angleValue');
    const gravityValue = document.getElementById('gravityValue');
    const statBox = document.getElementById('statBox');
    const playBtn = document.getElementById('playBtn');
    const resetBtn = document.getElementById('resetBtn');
    const origin = { x: 70, y: 410 };
    const scale = 5;
    let startTime = 0;
    let running = false;
    let animationId = 0;

    function getParams() {
      const speed = Number(speedInput.value);
      const angle = Number(angleInput.value) * Math.PI / 180;
      const gravity = Number(gravityInput.value);
      const vx = speed * Math.cos(angle);
      const vy = speed * Math.sin(angle);
      const totalTime = (2 * vy) / gravity;
      const maxHeight = (vy * vy) / (2 * gravity);
      const range = vx * totalTime;
      return { speed, angle, gravity, vx, vy, totalTime, maxHeight, range };
    }

    function updateLabels() {
      speedValue.textContent = `${speedInput.value} m/s`;
      angleValue.textContent = `${angleInput.value}°`;
      gravityValue.textContent = `${gravityInput.value} m/s²`;
    }

    function draw(t = 0) {
      const params = getParams();
      const clampedT = Math.min(t, params.totalTime);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(40, origin.y);
      ctx.lineTo(canvas.width - 30, origin.y);
      ctx.stroke();

      ctx.strokeStyle = '#2563eb';
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let step = 0; step <= 100; step += 1) {
        const time = params.totalTime * step / 100;
        const x = origin.x + params.vx * time * scale;
        const y = origin.y - (params.vy * time - 0.5 * params.gravity * time * time) * scale;
        if (step === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      const currentX = origin.x + params.vx * clampedT * scale;
      const currentY = origin.y - (params.vy * clampedT - 0.5 * params.gravity * clampedT * clampedT) * scale;
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(currentX, currentY, 10, 0, Math.PI * 2);
      ctx.fill();

      statBox.innerHTML = `비행 시간: ${params.totalTime.toFixed(1)}초<br>최고 높이: ${params.maxHeight.toFixed(1)}m<br>수평 이동 거리: ${params.range.toFixed(1)}m`;
    }

    function animate(timestamp) {
      if (!startTime) startTime = timestamp;
      const elapsed = (timestamp - startTime) / 1000;
      draw(elapsed);
      if (elapsed < getParams().totalTime) animationId = requestAnimationFrame(animate);
      else running = false;
    }

    function start() {
      cancelAnimationFrame(animationId);
      startTime = 0;
      running = true;
      animationId = requestAnimationFrame(animate);
    }

    function reset() {
      cancelAnimationFrame(animationId);
      running = false;
      startTime = 0;
      updateLabels();
      draw(0);
    }

    [speedInput, angleInput, gravityInput].forEach((input) => {
      input.addEventListener('input', () => {
        updateLabels();
        if (!running) draw(0);
      });
    });
    playBtn.addEventListener('click', start);
    resetBtn.addEventListener('click', reset);
    reset();
  </script>
</body>
</html>
