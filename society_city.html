<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>통합사회 도시 파트</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;background:#f8fafc;color:#0f172a;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
    body{padding:clamp(18px,4vw,42px)}
    .page{width:min(980px,100%);margin:0 auto;display:grid;gap:18px}
    .hero,.card{border:1px solid #dbe3ef;border-radius:24px;background:#fff;box-shadow:0 14px 38px rgba(15,23,42,.09)}
    .hero{padding:clamp(24px,5vw,44px);background:linear-gradient(135deg,#064e3b,#16a34a);color:#fff}
    .badge{display:inline-flex;border:1px solid rgba(255,255,255,.32);border-radius:999px;padding:7px 12px;background:rgba(255,255,255,.13);font-weight:800;font-size:.86rem}
    h1{margin-top:16px;font-size:clamp(2rem,5vw,3.4rem);line-height:1.1;letter-spacing:-.04em}
    .hero p{margin-top:12px;color:#dcfce7;line-height:1.65;font-size:1.05rem}
    .card{padding:24px}
    .card h2{font-size:1.35rem;letter-spacing:-.03em}
    .card p,.card li{color:#475569;line-height:1.7}
    .card ul{margin-top:12px;padding-left:20px}
    .back-link{display:inline-flex;align-items:center;justify-content:center;width:max-content;border:1px solid #bbf7d0;border-radius:999px;background:#f0fdf4;color:#15803d;text-decoration:none;font-weight:900;padding:10px 14px}
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <span class="badge">🏙️ 통합사회 · 도시</span>
      <h1>도시 파트 학습 파일</h1>
      <p>통합사회 도시 단원 자료를 담기 위한 별도 페이지입니다. 도시 파트를 선택하면 이 파일로 이동합니다.</p>
    </section>

    <section class="card">
      <h2>학습 준비 영역</h2>
      <p>도시 파트 내용이 추가되면 이곳에 정리 자료와 퀴즈를 배치할 수 있습니다.</p>
      <ul>
        <li>도시화의 의미와 특징</li>
        <li>도시 내부 구조와 생활권</li>
        <li>도시 문제와 지속 가능한 도시</li>
      </ul>
    </section>

    <a class="back-link" href="./society_hub.html">← 통합사회 선택으로 돌아가기</a>
  </main>
</body>
</html>
