<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIMPUL STUDY</title>
  <meta name="simpul-api-base" content="./api" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles/index.css" />
</head>
<body>
  <main class="page-shell">
    <section class="hero box">
      <div class="badge">SIMPUL STUDY PORTAL</div>
      <div class="line-wrap" id="lineWrap">
        <h1 id="line1" class="line"></h1>
        <h2 id="line2" class="line"></h2>
      </div>
      <h2 id="finalLine" class="final-line"></h2>
      <p class="tagline"> </p>

      <div class="actions">
        <a id="startStudyBtn" class="btn main" href="./portal.html" data-usage-event="start_study">학습 시작</a>
      </div>
    </section>

    <section class="hero-enhance box" aria-label="빠른 안내">
      <div class="enhance-item"><strong>STEP 1.</strong> 인트로 애니메이션을 확인합니다.</div>
      <div class="enhance-item"><strong>STEP 2.</strong> 학습 시작을 눌러 바로 포털로 이동합니다.</div>
      <div class="enhance-item"><strong>TIP.</strong> 목표를 설정하고 과목별로 집중 학습하세요.</div>
    </section>
  </main>
  <aside id="adminUsageWidget" class="admin-widget" aria-label="관리자 이용 현황">
    <button id="adminToggleBtn" class="admin-toggle" type="button" aria-expanded="false" aria-controls="adminPanel">관리자</button>
    <div id="adminPanel" class="admin-panel" hidden>
      <form id="adminLoginForm" class="admin-login">
        <label for="adminPasswordInput">관리자 인증</label>
        <div class="admin-login-row">
          <input id="adminPasswordInput" type="password" autocomplete="current-password" placeholder="비밀번호" />
          <button type="submit">확인</button>
        </div>
        <p id="adminMessage" class="admin-message">인증하면 학생들의 사이트 이용 현황을 볼 수 있습니다.</p>
      </form>
      <div id="usageStatsPanel" class="usage-stats" hidden>
        <div class="usage-header">
          <strong>이용 현황</strong>
          <button id="usageRefreshBtn" type="button">새로고침</button>
        </div>
        <div id="usageSummary" class="usage-summary"></div>
        <div id="usageDaily" class="usage-daily"></div>
      </div>
    </div>
  </aside>
  <script src="./scripts/usage.js" defer></script>
  <script src="./scripts/index.js" defer></script>
</body>
</html>
