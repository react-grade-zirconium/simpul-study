<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영어 부교재</title>
  <style>
    :root{color-scheme:light;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;padding:24px;background:#f6f8fc;color:#0f172a}
    main{max-width:860px;margin:0 auto;display:grid;gap:16px}
    section{border:1px solid #dbe3ef;border-radius:18px;background:#fff;padding:22px;box-shadow:0 12px 28px rgba(15,23,42,.08)}
    a.back{display:inline-flex;margin-bottom:10px;color:#15803d;text-decoration:none;font-weight:800}
    h1{margin:0;font-size:clamp(1.5rem,4vw,2.2rem);letter-spacing:-.04em}
    h2{margin:0 0 10px;color:#15803d;font-size:1.05rem}
    p,li{line-height:1.7}
    ul{margin:0;padding-left:1.2rem}
  </style>
</head>
<body>
  <main>
    <section>
      <a class="back" href="./english_hub.html">← 영어 선택으로</a>
      <h1>📗 영어 부교재</h1>
      <p>부교재 지문과 추가 문제를 따로 복습하며 시험 범위를 빠르게 확인하는 공간입니다.</p>
    </section>
    <section>
      <h2>학습 루틴</h2>
      <ul>
        <li>각 지문의 소재, 주제, 글의 흐름을 정리하기</li>
        <li>오답이 나온 문항의 보기 근거를 다시 확인하기</li>
        <li>본문과 겹치는 표현 또는 문법 포인트를 함께 표시하기</li>
      </ul>
    </section>
  </main>
</body>
</html>
