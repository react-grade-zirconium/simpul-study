<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>국어 소설 모의고사 선택</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:#f6f8fc;color:#0f172a;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
    body{display:grid;place-items:center;padding:20px;overflow:auto}
    .mock-select{width:min(560px,100%);border:1px solid #dbe3ef;border-radius:22px;background:#fff;padding:28px;box-shadow:0 12px 32px rgba(15,23,42,.08);text-align:center}
    .back{display:inline-flex;margin-bottom:12px;color:#1d4ed8;text-decoration:none;font-weight:900}
    .label{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:#eff6ff;color:#1d4ed8;padding:7px 12px;font-size:.88rem;font-weight:800}
    h1{margin-top:14px;font-size:clamp(1.55rem,4vw,2.15rem);line-height:1.25;letter-spacing:-.04em}
    p{margin-top:8px;color:#64748b;line-height:1.55;font-size:.96rem}
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
    .choice{display:flex;align-items:center;justify-content:center;gap:8px;min-height:86px;border:1px solid #dbe3ef;border-radius:16px;background:#f8fafc;color:#0f172a;text-decoration:none;font-size:1.18rem;font-weight:900;transition:background .15s ease,border-color .15s ease,transform .15s ease}
    .choice:hover,.choice:focus-visible{background:#eff6ff;border-color:#93c5fd;transform:translateY(-2px);outline:none}
    .choice.round2:hover,.choice.round2:focus-visible{background:#f5f3ff;border-color:#c4b5fd}
    .choice small{display:block;margin-top:4px;color:#64748b;font-size:.78rem;font-weight:800}
    @media (max-width:520px){body{padding:14px}.mock-select{padding:22px 16px}.choices{grid-template-columns:1fr}.choice{min-height:72px}}
  </style>
</head>
<body>
  <main class="mock-select" aria-labelledby="mockTitle">
    <a class="back" href="./korean_hub.html">← 국어 선택으로</a><br />
    <span class="label">📝 소설 모의고사</span>
    <h1 id="mockTitle">회차를 선택하세요</h1>
    <p>사회 파트 선택처럼 카드에서 원하는 모의고사 회차를 바로 고를 수 있습니다.</p>

    <nav class="choices" aria-label="소설 모의고사 회차 선택">
      <a class="choice round1" href="./korean_novel_mock.html">
        <span>1회<small>기존 모의고사</small></span>
      </a>
      <a class="choice round2" href="./korean_novel_mock_2.html">
        <span>2회<small>추가 예정</small></span>
      </a>
    </nav>
  </main>
</body>
</html>
