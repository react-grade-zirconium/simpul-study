<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>국어 학습 — SIMPUL STUDY</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#f8fafc;--surface:#fff;--line:#dbe3ef;--text:#0f172a;--muted:#64748b;--primary:#2563eb;--soft:#eff6ff}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Pretendard',system-ui,sans-serif;line-height:1.6;padding:18px}
    .page{max-width:1180px;margin:0 auto;display:grid;gap:16px}
    .hero,.lesson-frame-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(15,23,42,.06)}
    .hero{padding:22px 24px;display:grid;gap:10px}
    .eyebrow{display:inline-flex;width:max-content;align-items:center;gap:6px;border:1px solid #bfdbfe;background:var(--soft);color:var(--primary);border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:800}
    h1{font-size:clamp(1.45rem,3vw,2.1rem);letter-spacing:-.04em}
    .hero p{color:var(--muted);font-size:.96rem}
    .lesson-frame-card{overflow:hidden;min-height:calc(100vh - 190px);display:grid;grid-template-rows:auto 1fr}
    .lesson-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(180deg,#fff,#f8fbff)}
    .lesson-head h2{font-size:1rem}.lesson-head span{font-size:.84rem;color:var(--muted)}
    .open-link{border:1px solid var(--line);border-radius:10px;padding:8px 11px;text-decoration:none;color:var(--primary);font-weight:800;background:#fff;font-size:.86rem;white-space:nowrap}
    .phonology-frame{width:100%;height:100%;min-height:760px;border:0;background:#fff}
    @media (max-width:720px){body{padding:10px}.hero{padding:18px}.lesson-frame-card{min-height:calc(100vh - 160px)}.lesson-head{align-items:flex-start;flex-direction:column}.phonology-frame{min-height:720px}}
  </style>
</head>
<body>
  <main class="page">
    <section class="hero" aria-labelledby="koreanTitle">
      <div class="eyebrow">공통국어</div>
      <h1 id="koreanTitle">국어 학습</h1>
      <p>공통국어 음운 파트를 아래 iframe으로 바로 학습할 수 있습니다.</p>
    </section>

    <section class="lesson-frame-card" aria-labelledby="phonologyTitle">
      <div class="lesson-head">
        <div>
          <h2 id="phonologyTitle">공통국어 · 음운 총정리</h2>
          <span>음운 기초, 자음·모음 체계, 형태소, 교체·탈락·첨가까지 탭으로 정리했습니다.</span>
        </div>
        <a class="open-link" href="./korean_phonology.html" target="_blank" rel="noopener">새 창으로 보기</a>
      </div>
      <iframe class="phonology-frame" src="./korean_phonology.html" title="공통국어 음운 총정리"></iframe>
    </section>
  </main>
</body>
</html>
