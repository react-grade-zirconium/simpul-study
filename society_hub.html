<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>통합사회 학습 선택</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:#f6f8fc;color:#0f172a;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
    body{display:grid;place-items:center;padding:20px;overflow:auto}
    .society-select{width:min(560px,100%);border:1px solid #dbe3ef;border-radius:22px;background:#fff;padding:28px;box-shadow:0 12px 32px rgba(15,23,42,.08);text-align:center}
    .label{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:#eff6ff;color:#1d4ed8;padding:7px 12px;font-size:.88rem;font-weight:800}
    h1{margin-top:14px;font-size:clamp(1.55rem,4vw,2.15rem);line-height:1.25;letter-spacing:-.04em}
    p{margin-top:8px;color:#64748b;line-height:1.55;font-size:.96rem}
    .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
    .choice{display:flex;align-items:center;justify-content:center;gap:8px;min-height:74px;border:1px solid #dbe3ef;border-radius:16px;background:#f8fafc;color:#0f172a;text-decoration:none;font-size:1.18rem;font-weight:900;transition:background .15s ease,border-color .15s ease,transform .15s ease}
    .choice:hover,.choice:focus-visible{background:#eff6ff;border-color:#93c5fd;transform:translateY(-2px);outline:none}
    .choice.city:hover,.choice.city:focus-visible{background:#f0fdf4;border-color:#86efac}
    .choice.geo:hover,.choice.geo:focus-visible{background:#fff7ed;border-color:#fdba74}
    @media (max-width:520px){body{padding:14px}.society-select{padding:22px 16px}.choices{grid-template-columns:1fr}.choice{min-height:62px}}
  </style>
</head>
<body>
  <main class="society-select" aria-labelledby="societyTitle">
    <span class="label">🌍 통합사회</span>
    <h1 id="societyTitle">파트를 선택하세요</h1>

    <nav class="choices" aria-label="통합사회 파트 선택">
      <a class="choice culture" href="./통합사회_4단원_정리.html">🎭 문화</a>
      <a class="choice city" href="./society_city.html">🏙️ 도시</a>
      <a class="choice geo" href="./society_geo_culture.html">🗺️ 지리 문화권</a>
    </nav>
  </main>
</body>
</html>
