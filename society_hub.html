<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>통합사회 학습 선택</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;min-height:100%;background:#f4f7fb;color:#0f172a;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
    body{padding:clamp(18px,4vw,42px)}
    .society-shell{width:min(980px,100%);margin:0 auto;display:grid;gap:22px}
    .hero{border:1px solid #dbe3ef;border-radius:26px;background:linear-gradient(135deg,#0f172a,#1d4ed8);color:#fff;padding:clamp(24px,5vw,44px);box-shadow:0 18px 44px rgba(15,23,42,.18)}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:7px 12px;background:rgba(255,255,255,.12);font-size:.86rem;font-weight:800;letter-spacing:.03em}
    h1{margin-top:16px;font-size:clamp(2rem,5vw,3.6rem);line-height:1.08;letter-spacing:-.04em}
    .hero p{margin-top:12px;color:#dbeafe;font-size:clamp(.98rem,2vw,1.12rem);line-height:1.65}
    .choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .choice-card{position:relative;min-height:230px;border:1px solid #dbe3ef;border-radius:24px;background:#fff;padding:24px;text-decoration:none;color:inherit;overflow:hidden;box-shadow:0 12px 34px rgba(15,23,42,.1);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
    .choice-card:hover,.choice-card:focus-visible{transform:translateY(-5px);border-color:#93c5fd;box-shadow:0 18px 44px rgba(37,99,235,.18);outline:none}
    .choice-card::after{content:"";position:absolute;right:-48px;bottom:-54px;width:160px;height:160px;border-radius:999px;background:var(--accent,#dbeafe);opacity:.38}
    .choice-icon{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--accent,#dbeafe);font-size:2rem;margin-bottom:18px}
    .choice-card h2{font-size:1.5rem;letter-spacing:-.03em}
    .choice-card p{margin-top:9px;color:#64748b;line-height:1.6;font-size:.98rem}
    .choice-action{position:absolute;left:24px;bottom:22px;display:inline-flex;align-items:center;gap:6px;color:#1d4ed8;font-weight:900}
    .culture{--accent:#dbeafe}.city{--accent:#dcfce7}.city .choice-action{color:#15803d}
    @media (max-width:720px){body{padding:14px}.choice-grid{grid-template-columns:1fr}.hero{border-radius:22px}.choice-card{min-height:205px}}
  </style>
</head>
<body>
  <main class="society-shell" aria-labelledby="societyTitle">
    <section class="hero">
      <span class="eyebrow">🌍 통합사회 학습</span>
      <h1 id="societyTitle">학습할 사회 파트를 선택하세요</h1>
      <p>문화 파트는 기존 정리 페이지로 이동하고, 도시 파트는 별도 학습 파일로 이동합니다.</p>
    </section>

    <section class="choice-grid" aria-label="통합사회 파트 선택">
      <a class="choice-card culture" href="./통합사회_4단원_정리.html" aria-label="문화 파트 기존 정리 페이지 열기">
        <div class="choice-icon" aria-hidden="true">🎭</div>
        <h2>문화</h2>
        <p>문화 변동, 문화 상대주의, 다문화 사회 내용을 기존 통합사회 4단원 정리 페이지에서 학습합니다.</p>
        <span class="choice-action">기존 페이지 열기 →</span>
      </a>

      <a class="choice-card city" href="./society_city.html" aria-label="도시 파트 별도 파일 열기">
        <div class="choice-icon" aria-hidden="true">🏙️</div>
        <h2>도시</h2>
        <p>도시화와 도시 문제 등 도시 파트 학습 자료를 별도 파일에서 확인합니다.</p>
        <span class="choice-action">도시 파일 열기 →</span>
      </a>
    </section>
  </main>
</body>
</html>
