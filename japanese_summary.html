<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>일본어 내용 정리</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;min-height:100%;background:#f6f8fc;color:#0f172a;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
    body{padding:24px;overflow:auto}
    .japanese-page{width:min(860px,100%);margin:0 auto;display:grid;gap:16px}
    .hero,.summary-card{border:1px solid #dbe3ef;border-radius:22px;background:#fff;padding:24px;box-shadow:0 12px 32px rgba(15,23,42,.08)}
    .label{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:#fef2f2;color:#b91c1c;padding:7px 12px;font-size:.88rem;font-weight:800}
    h1{margin-top:14px;font-size:clamp(1.55rem,4vw,2.25rem);line-height:1.25;letter-spacing:-.04em}
    h2{font-size:1.22rem;color:#b91c1c;margin-bottom:10px}
    p{margin-top:8px;color:#64748b;line-height:1.65;font-size:.96rem}
    .back-link{display:inline-flex;align-items:center;justify-content:center;width:max-content;border:1px solid #fecaca;border-radius:999px;background:#fff7f7;color:#7f1d1d;text-decoration:none;padding:9px 14px;font-weight:900;transition:background .15s ease,border-color .15s ease,transform .15s ease}
    .back-link:hover,.back-link:focus-visible{background:#fef2f2;border-color:#fca5a5;transform:translateY(-1px);outline:none}
    .study-list{display:grid;gap:10px;margin-top:14px;list-style:none}
    .study-list li{border:1px solid #e2e8f0;border-radius:14px;background:#f8fafc;padding:14px;line-height:1.6;color:#334155}
    .jump-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}
    .jump-card{display:grid;gap:8px;border:1px solid #fecaca;border-radius:18px;background:#fff7f7;color:#7f1d1d;text-decoration:none;padding:18px;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
    .jump-card:hover,.jump-card:focus-visible{border-color:#f87171;box-shadow:0 10px 24px rgba(248,113,113,.18);transform:translateY(-2px);outline:none}
    .jump-card strong{font-size:1.08rem}.jump-card span{color:#64748b;line-height:1.5}
    @media (max-width:620px){body{padding:14px}.hero,.summary-card{padding:20px 16px}.jump-list{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="japanese-page">
    <a class="back-link" href="./japanese_hub.html">← 일본어 파트 선택</a>

    <section class="hero" aria-labelledby="japaneseSummaryTitle">
      <span class="label">🇯🇵 일본어</span>
      <h1 id="japaneseSummaryTitle">내용 정리</h1>
      <p>수업에서 배운 일본어 핵심 개념을 한눈에 확인하며 복습하세요.</p>
    </section>

    <section class="summary-card" aria-labelledby="summaryHeading">
      <h2 id="summaryHeading">핵심 개념</h2>
      <ul class="study-list">
        <li><strong>발음:</strong> 모음 5개와 청음·탁음·반탁음의 차이를 확인합니다.</li>
        <li><strong>인사 표현:</strong> 상황별 기본 인사와 감사·사과 표현을 반복합니다.</li>
        <li><strong>문장 구조:</strong> 주제 표시 조사와 기본 어순을 예문으로 정리합니다.</li>
      </ul>
      <div class="jump-list" aria-label="일본어 문자 학습 바로가기">
        <a class="jump-card" href="./japanese_hiragana.html">
          <strong>ひらがな 히라가나 외우기</strong>
          <span>새 화면으로 이동해서 히라가나 카드를 크게 봅니다.</span>
        </a>
        <a class="jump-card" href="./japanese_katakana.html">
          <strong>カタカナ 가타카나 외우기</strong>
          <span>새 화면으로 이동해서 가타카나 카드를 크게 봅니다.</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
