<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simpul Study — 제2회 현대소설 미니 모의고사</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:#f6f8fc;color:#0f172a;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
    body{display:grid;place-items:center;padding:20px;overflow:auto}
    .notice{width:min(640px,100%);border:1px solid #dbe3ef;border-radius:22px;background:#fff;padding:28px;box-shadow:0 12px 32px rgba(15,23,42,.08);text-align:center}
    .back{display:inline-flex;margin-bottom:12px;color:#1d4ed8;text-decoration:none;font-weight:900}
    .label{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:#eff6ff;color:#1d4ed8;padding:7px 12px;font-size:.88rem;font-weight:800}
    h1{margin-top:14px;font-size:clamp(1.55rem,4vw,2.15rem);line-height:1.25;letter-spacing:-.04em}
    p{margin-top:8px;color:#64748b;line-height:1.6;font-size:.96rem}
    .actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}
    .action{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border:1px solid #93c5fd;border-radius:12px;background:#eff6ff;color:#1d4ed8;padding:0 16px;text-decoration:none;font-weight:900}
    .action.secondary{border-color:#dbe3ef;background:#f8fafc;color:#334155}
    .action:hover,.action:focus-visible{background:#dbeafe;outline:none}
    .action.secondary:hover,.action.secondary:focus-visible{background:#eef2ff}
  </style>
</head>
<body>
  <main class="notice" aria-labelledby="mock2Title">
    <a class="back" href="./korean_mock.html">← 회차 선택으로</a><br />
    <span class="label">📝 제2회</span>
    <h1 id="mock2Title">현대소설 미니 모의고사</h1>
    <p>제2회 모의고사 페이지입니다. 문제 자료가 준비되면 이 화면에 바로 추가됩니다.</p>
    <div class="actions">
      <a class="action" href="./korean_mock.html">회차 다시 선택</a>
      <a class="action secondary" href="./korean_novel_mock.html">1회 풀러 가기</a>
    </div>
  </main>
</body>
</html>
