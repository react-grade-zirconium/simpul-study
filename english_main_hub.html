<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영어 본문 선택</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:#f6f8fc;color:#0f172a;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
    body{display:grid;place-items:center;padding:20px;overflow:auto}
    .main-select{width:min(720px,100%);border:1px solid #dbe3ef;border-radius:22px;background:#fff;padding:28px;box-shadow:0 12px 32px rgba(15,23,42,.08);text-align:center}
    .back{display:inline-flex;margin-bottom:12px;color:#4338ca;text-decoration:none;font-weight:900}
    .label{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:#eef2ff;color:#4338ca;padding:7px 12px;font-size:.88rem;font-weight:800}
    h1{margin-top:14px;font-size:clamp(1.55rem,4vw,2.15rem);line-height:1.25;letter-spacing:-.04em}
    p{margin-top:8px;color:#64748b;line-height:1.55;font-size:.96rem}
    .choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px}
    .choice{display:flex;align-items:center;justify-content:center;gap:8px;min-height:74px;border:1px solid #dbe3ef;border-radius:16px;background:#f8fafc;color:#0f172a;text-decoration:none;font-size:1.18rem;font-weight:900;transition:background .15s ease,border-color .15s ease,transform .15s ease}
    .choice:hover,.choice:focus-visible{background:#eef2ff;border-color:#a5b4fc;transform:translateY(-2px);outline:none}
    .choice.extra:hover,.choice.extra:focus-visible{background:#f0fdf4;border-color:#86efac}
    .choice.lesson3:hover,.choice.lesson3:focus-visible{background:#fff7ed;border-color:#fdba74}
    .choice.lesson3-extra:hover,.choice.lesson3-extra:focus-visible{background:#f5f3ff;border-color:#c4b5fd}
    @media (max-width:520px){body{padding:14px}.main-select{padding:22px 16px}.choices{grid-template-columns:1fr}.choice{min-height:62px}}
  </style>
</head>
<body>
  <main class="main-select" aria-labelledby="mainTitle">
    <a class="back" href="./english_hub.html">← 영어 선택으로</a><br />
    <span class="label">📘 영어 본문</span>
    <h1 id="mainTitle">본문 파트를 선택하세요</h1>
    <p>사회 파트 선택처럼 2과, 2과 추가 지문, 3과, 3과 추가 지문을 카드로 나누었습니다.</p>

    <nav class="choices" aria-label="영어 본문 파트 선택">
      <a class="choice lesson2" href="./english_main.html">2과</a>
      <a class="choice extra" href="./english_main_lesson2_extra.html">2과 추가 지문</a>
      <a class="choice lesson3" href="./english_main_lesson3.html">3과</a>
      <a class="choice lesson3-extra" href="./english_main_lesson3_extra.html">3과 추가 지문</a>
    </nav>
  </main>
</body>
</html>
