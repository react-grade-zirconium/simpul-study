<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공통국어 — 문법 요소</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;min-height:100%;background:#f6f8fc;color:#0f172a;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
    body{display:grid;place-items:center;padding:20px}
    .placeholder{width:min(720px,100%);border:1px solid #dbe3ef;border-radius:22px;background:#fff;padding:30px;box-shadow:0 12px 32px rgba(15,23,42,.08);text-align:center}
    .label{display:inline-flex;border-radius:999px;background:#f5f3ff;color:#6d28d9;padding:7px 12px;font-size:.88rem;font-weight:800}
    h1{margin-top:14px;font-size:clamp(1.6rem,4vw,2.2rem);letter-spacing:-.04em}
    p{margin-top:10px;color:#64748b;line-height:1.65}
    .back{display:inline-flex;margin-top:22px;align-items:center;justify-content:center;min-height:46px;border:1px solid #dbe3ef;border-radius:14px;background:#f8fafc;color:#0f172a;text-decoration:none;font-weight:900;padding:0 18px;transition:background .15s ease,border-color .15s ease,transform .15s ease}
    .back:hover,.back:focus-visible{background:#eff6ff;border-color:#93c5fd;transform:translateY(-2px);outline:none}
  </style>
</head>
<body>
  <main class="placeholder" aria-labelledby="elementsTitle">
    <span class="label">🧱 공통국어 문법</span>
    <h1 id="elementsTitle">문법 요소</h1>
    <p>문법 요소 학습 자료가 들어갈 공간입니다.</p>
    <a class="back" href="./korean_grammar_hub.html">← 문법 선택으로</a>
  </main>
</body>
</html>
