<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>통합과학 생명 학습</title>
  <style>
    :root{color-scheme:light;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;background:#f6f8fc;color:#0f172a;padding:24px}
    main{max-width:860px;margin:0 auto;display:grid;gap:16px}
    section{border:1px solid #dbe3ef;border-radius:18px;background:#fff;padding:20px;box-shadow:0 12px 28px rgba(15,23,42,.08)}
    .badge{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;border-radius:999px;background:#f0fdf4;color:#15803d;padding:7px 12px;font-size:.84rem;font-weight:900}
    h1{font-size:clamp(1.45rem,4vw,2.2rem);line-height:1.25;letter-spacing:-.04em}
    h2{margin-bottom:10px;color:#15803d;font-size:1.05rem}
    p,li{line-height:1.7;color:#334155}
    ul{padding-left:1.2rem}
    .back{display:inline-flex;width:max-content;align-items:center;gap:6px;color:#2563eb;text-decoration:none;font-weight:800}
    .back:hover,.back:focus-visible{text-decoration:underline;outline:none}
    @media (max-width:520px){body{padding:14px}section{padding:18px}}
  </style>
</head>
<body>
  <main>
    <a class="back" href="./science_hub.html">← 과학 파트 선택으로 돌아가기</a>
    <section>
      <span class="badge">🧬 생명 파트</span>
      <h1>통합과학 생명 학습</h1>
      <p>핵심 개념을 먼저 확인하고, 그래프·자료 해석과 문제 적용 순서로 복습하세요.</p>
    </section>
    <section>
      <h2>핵심 학습 주제</h2>
      <ul>
        <li>세포 구조와 생명 활동의 관계를 기능 중심으로 정리하기</li>
        <li>유전 정보 전달 과정과 형질 발현의 흐름 설명하기</li>
        <li>항상성과 생태계 상호 작용을 자료 해석에 적용하기</li>
      </ul>
    </section>
    <section>
      <h2>오늘의 학습 루틴</h2>
      <ul>
        <li>구조 이름만 외우지 말고 기능과 함께 말해 보기</li>
        <li>과정도는 원인→과정→결과 순서로 다시 그리기</li>
        <li>자료형 문제는 변인과 대조군을 먼저 표시하기</li>
      </ul>
    </section>
  </main>
</body>
</html>
