<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>수학 부교재</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;min-height:100%;background:#f6f8fc;color:#0f172a;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
    body{display:grid;place-items:center;padding:20px}
    .card{width:min(720px,100%);border:1px solid #dbe3ef;border-radius:22px;background:#fff;padding:28px;box-shadow:0 12px 32px rgba(15,23,42,.08);text-align:center}
    .label{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:#fef3c7;color:#b45309;padding:7px 12px;font-size:.88rem;font-weight:800}
    h1{margin-top:14px;font-size:clamp(1.55rem,4vw,2.15rem);line-height:1.25;letter-spacing:-.04em}
    p{margin-top:8px;color:#64748b;line-height:1.55;font-size:.96rem}
    .back{display:inline-flex;margin-top:22px;color:#2563eb;font-weight:800;text-decoration:none}
    .back:hover,.back:focus-visible{text-decoration:underline;outline:none}
  </style>
</head>
<body>
  <main class="card" aria-labelledby="mathSupplementTitle">
    <span class="label">📘 수학 부교재</span>
    <h1 id="mathSupplementTitle">수학 부교재</h1>
    <p>수학 부교재 학습 자료를 추가할 수 있는 페이지입니다.</p>
    <a class="back" href="./math_hub.html">← 수학 자료 선택으로</a>
  </main>
</body>
</html>
