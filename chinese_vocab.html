<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중국어 단어장</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #c0392b;       --primary-light: #fdf2f1;
  --gold:    #d4a017;       --gold-light:    #fefae8;
  --green:   #16a34a;       --green-light:   #f0fdf4;
  --blue:    #2563eb;       --blue-light:    #eff6ff;
  --purple:  #7c3aed;       --purple-light:  #f5f3ff;
  --bg:      #f8fafc;       --surface:       #fff;
  --border:  #e2e8f0;
  --text:    #0f172a;       --text-sec:      #64748b;
  --shadow:  0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14.5px;
  line-height: 1.75;
}

/* ── HEADER ── */
.page-header {
  position: sticky; top: 0; z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.header-inner {
  max-width: 980px; margin: 0 auto;
  padding: 12px 20px 0;
}
.subject-label {
  font-size: 11px; font-weight: 500; letter-spacing: .08em;
  text-transform: uppercase; color: var(--text-sec);
  margin-bottom: 2px;
}
.page-title {
  font-size: 19px; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px;
}
.badge-unit {
  font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 99px;
  background: var(--primary); color: #fff; letter-spacing: .03em;
}

/* ── TAB BAR ── */
.tab-bar {
  display: flex; overflow-x: auto; gap: 2px;
  scrollbar-width: none; padding-bottom: 0;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab-btn {
  flex-shrink: 0; display: flex; align-items: center; gap: 6px;
  padding: 8px 14px; font-size: 13px; font-weight: 500;
  color: var(--text-sec); background: none; border: none;
  border-bottom: 3px solid transparent;
  cursor: pointer; transition: color .15s;
  white-space: nowrap;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 700; }
.tab-num {
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--border); color: var(--text-sec);
  font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, color .15s;
}
.tab-btn.active .tab-num { background: var(--primary); color: #fff; }

/* ── CONTENT ── */
.content-wrap {
  max-width: 980px; margin: 0 auto;
  padding: 24px 20px 100px;
}
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── UNIT BANNER ── */
.unit-banner {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--primary-light); border: 1px solid #f5c6c2;
  border-radius: 6px; padding: 5px 12px;
  font-size: 12px; font-weight: 500; color: var(--primary);
  margin-bottom: 18px;
}

/* ── CONTROLS BAR ── */
.controls-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  margin-bottom: 18px;
}
.search-wrap {
  position: relative; flex: 1; min-width: 180px;
}
.search-wrap input {
  width: 100%; padding: 7px 12px 7px 34px;
  border: 1px solid var(--border); border-radius: 8px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px; color: var(--text);
  background: var(--surface); outline: none;
  transition: border-color .15s;
}
.search-wrap input:focus { border-color: var(--primary); }
.search-icon {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--text-sec); font-size: 14px; pointer-events: none;
}
.sort-btn {
  padding: 7px 13px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); font-family: 'Noto Sans KR', sans-serif;
  font-size: 12px; font-weight: 500; color: var(--text-sec);
  cursor: pointer; transition: all .15s;
}
.sort-btn:hover, .sort-btn.active { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
.count-badge {
  font-size: 12px; color: var(--text-sec); padding: 0 4px;
}

/* ── VIEW TOGGLE ── */
.view-toggle { display: flex; gap: 4px; }
.view-btn {
  width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface); cursor: pointer; color: var(--text-sec);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; transition: all .15s;
}
.view-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }

/* ── TABLE VIEW ── */
.vocab-table { width: 100%; border-collapse: collapse; }
.vocab-table thead th {
  background: #1e293b; color: #fff; font-size: 12px;
  font-weight: 700; padding: 9px 14px; text-align: left;
  letter-spacing: .04em;
}
.vocab-table thead th:first-child { border-radius: 8px 0 0 0; }
.vocab-table thead th:last-child  { border-radius: 0 8px 0 0; }
.vocab-table tbody tr {
  border-bottom: 1px solid var(--border);
  transition: background .1s;
}
.vocab-table tbody tr:hover { background: var(--primary-light); }
.vocab-table td {
  padding: 9px 14px; font-size: 13.5px;
}
.td-word {
  font-weight: 700; font-size: 16px; letter-spacing: .02em;
  color: var(--primary);
}
.td-pinyin {
  font-size: 13px; color: var(--blue); font-weight: 500; font-style: italic;
}
.td-meaning { color: var(--text); }

/* ── CARD VIEW ── */
.vocab-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
}
.vocab-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 14px 12px;
  box-shadow: var(--shadow); cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  position: relative; overflow: hidden;
  user-select: none;
}
.vocab-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0;
  height: 3px; background: var(--primary);
}
.vocab-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
.card-word {
  font-size: 22px; font-weight: 700; color: var(--primary);
  letter-spacing: .04em; margin-bottom: 4px;
}
.card-pinyin {
  font-size: 12px; color: var(--blue); font-weight: 500; font-style: italic;
  margin-bottom: 8px;
}
.card-meaning {
  font-size: 13px; color: var(--text); font-weight: 500;
  border-top: 1px solid var(--border); padding-top: 8px;
}
.card-flip-hint {
  font-size: 10px; color: var(--text-sec);
  text-align: right; margin-top: 6px;
}

/* ── FLASHCARD VIEW ── */
.flashcard-wrap {
  display: flex; flex-direction: column; align-items: center;
  padding: 10px 0;
}
.fc-nav {
  display: flex; align-items: center; gap: 16px; margin-bottom: 20px;
}
.fc-counter { font-size: 13px; color: var(--text-sec); font-weight: 500; }
.fc-btn {
  width: 38px; height: 38px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--surface);
  cursor: pointer; font-size: 16px; color: var(--text-sec);
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.fc-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.fc-btn:disabled { opacity: .35; cursor: default; }
.flashcard {
  width: 100%; max-width: 420px; min-height: 240px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,.08);
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 32px 28px;
  cursor: pointer; position: relative;
  transition: transform .12s;
}
.flashcard:active { transform: scale(.98); }
.flashcard::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0;
  height: 4px; background: var(--primary); border-radius: 16px 16px 0 0;
}
.fc-word {
  font-size: 42px; font-weight: 700; color: var(--primary);
  letter-spacing: .06em; margin-bottom: 8px;
}
.fc-pinyin {
  font-size: 16px; color: var(--blue); font-style: italic; font-weight: 500;
  margin-bottom: 18px;
}
.fc-answer {
  font-size: 18px; font-weight: 700; color: var(--text);
  border-top: 2px solid var(--border); padding-top: 16px;
  text-align: center; width: 100%;
  display: none;
}
.flashcard.revealed .fc-answer { display: block; }
.fc-reveal-hint {
  font-size: 12px; color: var(--text-sec); margin-top: 16px;
}
.flashcard.revealed .fc-reveal-hint { display: none; }
.fc-actions { display: flex; gap: 10px; margin-top: 16px; }
.fc-result-btn {
  flex: 1; padding: 9px 16px; border-radius: 8px; border: none;
  font-family: 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 700;
  cursor: pointer; transition: opacity .15s;
}
.fc-result-btn:hover { opacity: .85; }
.btn-good { background: var(--green); color: #fff; }
.btn-bad  { background: var(--primary); color: #fff; }
.fc-progress {
  width: 100%; max-width: 420px; margin-top: 12px;
  display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--text-sec);
}
.fc-progress-bar {
  flex: 1; height: 5px; background: var(--border); border-radius: 99px; overflow: hidden;
}
.fc-progress-fill { height: 100%; background: var(--green); border-radius: 99px; transition: width .3s; }

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center; padding: 48px 20px;
  color: var(--text-sec); font-size: 13px;
}
.empty-state div { font-size: 32px; margin-bottom: 10px; }

/* ── SCROLL TO TOP ── */
.totop {
  position: fixed; bottom: 24px; right: 24px;
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--primary); color: #fff;
  border: none; cursor: pointer; font-size: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
  display: flex; align-items: center; justify-content: center;
  transition: opacity .2s, transform .2s;
  opacity: 0; transform: translateY(10px); pointer-events: none;
}
.totop.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }

/* ── RESPONSIVE ── */
@media (max-width: 640px) {
  .vocab-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .fc-word { font-size: 34px; }
  .flashcard { min-height: 200px; padding: 24px 20px; }
}
</style>
</head>

    { w:'扫',     p:'sǎo',          m:'(QR코드를) 스캔하다, 쓸다' },
    { w:'一下',   p:'yíxià',        m:'좀 ~해보다 (가벼운 시도)' },
    { w:'二维码', p:'èrwéimǎ',      m:'QR 코드' },
    { w:'这个',   p:'zhège',        m:'이것, 이 사람' },
    { w:'只',     p:'zhī',          m:'마리 (동물을 세는 단위)' },
    { w:'烤鸭',   p:'kǎoyā',        m:'오리구이 (베이징 덕)' },
    { w:'包子',   p:'bāozi',        m:'바오쯔 (고기/야채 만두)' },
    { w:'杯',     p:'bēi',          m:'잔, 컵 (단위)' },
    { w:'可乐',   p:'kělè',         m:'콜라' },
    { w:'米饭',   p:'mǐfàn',        m:'쌀밥, 공깃밥' },
    { w:'饺子',   p:'jiǎozi',       m:'물만두, 교자' },
    { w:'喝',     p:'hē',           m:'마시다' },
    { w:'茶',     p:'chá',          m:'차 (음료)' },
    { w:'咖啡',   p:'kāfēi',        m:'커피' },
    { w:'以前',   p:'yǐqián',       m:'이전에, 예전에' },
    { w:'过',     p:'guo',          m:'~해 본 적이 있다 (경험)' },
    { w:'火锅',   p:'huǒguō',       m:'훠궈 (중국식 샤브샤브)' },
    { w:'味道',   p:'wèidao',       m:'맛' },
    { w:'怎么样', p:'zěnmeyàng',    m:'어때, 어떠한가' },
    { w:'辣',     p:'là',           m:'맵다' },
    { w:'不过',   p:'búguò',        m:'하지만, 그렇지만' },
    { w:'好吃',   p:'hǎochī',       m:'맛있다' },
    { w:'没事儿', p:'méishìr',      m:'괜찮아, 문제없어' },
    { w:'怕',     p:'pà',           m:'무서워하다, 두려워하다' },
    { w:'天气',   p:'tiānqì',       m:'날씨' },
    { w:'咸',     p:'xián',         m:'짜다' },
    { w:'北京',   p:'Běijīng',      m:'베이징 (중국의 수도)' },
    { w:'京剧',   p:'jīngjù',       m:'경극 (중국 전통 연극)' },
    { w:'穿',     p:'chuān',        m:'(옷·신발을) 입다, 신다' },
    { w:'旗袍',   p:'qípáo',        m:'치파오 (중국 전통 의상)' },
    { w:'酸',     p:'suān',         m:'시다' },
    { w:'甜',     p:'tián',         m:'달다' },
    { w:'苦',     p:'kǔ',           m:'쓰다' },
  ],
};
VOCAB[3] = [...VOCAB[0], ...VOCAB[1], ...VOCAB[2]];

// ── STATE ──────────────────────────────────────────────
const tabState = [0,1,2,3].map(() => ({
  viewMode: 'table',   // 'table' | 'card' | 'flash'
  sort: 'default',     // 'default' | 'alpha' | 'shuffle'
  search: '',
  fcIdx: 0,
  fcRevealed: false,
  fcKnown: new Set(),
  fcUnknown: new Set(),
}));

// ── UTILITY ──────────────────────────────────────────────
function getFiltered(tabIdx) {
  const s = tabState[tabIdx];
  let data = [...VOCAB[tabIdx]];
  if (s.search.trim()) {
    const q = s.search.trim().toLowerCase();
    data = data.filter(d =>
      d.w.includes(q) || d.p.toLowerCase().includes(q) || d.m.includes(q)
    );
  }
  if (s.sort === 'alpha') data.sort((a,b) => a.w.localeCompare(b.w));
  if (s.sort === 'shuffle') data.sort(() => Math.random() - .5);
  return data;
}

// ── RENDER CONTROLS ──────────────────────────────────────
function renderControls(tabIdx) {
  const s = tabState[tabIdx];
  const data = getFiltered(tabIdx);
  const el = document.getElementById(`controls-${tabIdx}`);
  el.innerHTML = `
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="단어, 병음, 뜻 검색…" value="${s.search}"
        oninput="tabState[${tabIdx}].search=this.value; renderAll(${tabIdx})">
    </div>
    <button class="sort-btn ${s.sort==='default'?'active':''}" onclick="setSort(${tabIdx},'default')">기본순</button>
    <button class="sort-btn ${s.sort==='alpha'?'active':''}" onclick="setSort(${tabIdx},'alpha')">가나다순</button>
    <button class="sort-btn ${s.sort==='shuffle'?'active':''}" onclick="setSort(${tabIdx},'shuffle')">셔플 🔀</button>
    <span class="count-badge">${data.length}개</span>
    <div class="view-toggle">
      <button class="view-btn ${s.viewMode==='table'?'active':''}" title="목록" onclick="setView(${tabIdx},'table')">☰</button>
      <button class="view-btn ${s.viewMode==='card'?'active':''}" title="카드" onclick="setView(${tabIdx},'card')">⊞</button>
      <button class="view-btn ${s.viewMode==='flash'?'active':''}" title="플래시카드" onclick="setView(${tabIdx},'flash')">🃏</button>
    </div>
  `;
}

// ── RENDER TABLE ──────────────────────────────────────────
function renderTable(tabIdx) {
  const data = getFiltered(tabIdx);
  if (!data.length) return `<div class="empty-state"><div>🔍</div>검색 결과가 없습니다.</div>`;
  return `<table class="vocab-table">
    <thead><tr>
      <th style="width:100px">단어 (汉字)</th>
      <th style="width:140px">병음 (Pinyin)</th>
      <th>뜻 (Meaning)</th>
    </tr></thead>
    <tbody>
      ${data.map(d=>`<tr>
        <td class="td-word">${d.w}</td>
        <td class="td-pinyin">${d.p}</td>
        <td class="td-meaning">${d.m}</td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

// ── RENDER CARD ───────────────────────────────────────────
function renderCards(tabIdx) {
  const data = getFiltered(tabIdx);
  if (!data.length) return `<div class="empty-state"><div>🔍</div>검색 결과가 없습니다.</div>`;
  return `<div class="vocab-grid">
    ${data.map(d=>`<div class="vocab-card">
      <div class="card-word">${d.w}</div>
      <div class="card-pinyin">${d.p}</div>
      <div class="card-meaning">${d.m}</div>
    </div>`).join('')}
  </div>`;
}

// ── RENDER FLASHCARD ──────────────────────────────────────
function renderFlash(tabIdx) {
  const s = tabState[tabIdx];
  const data = getFiltered(tabIdx);
  if (!data.length) return `<div class="empty-state"><div>🔍</div>검색 결과가 없습니다.</div>`;
  if (s.fcIdx >= data.length) s.fcIdx = 0;

  const d = data[s.fcIdx];
  const total = data.length;
  const knownPct = Math.round((s.fcKnown.size / total) * 100);

  return `<div class="flashcard-wrap">
    <div class="fc-nav">
      <button class="fc-btn" ${s.fcIdx===0?'disabled':''} onclick="fcMove(${tabIdx},-1)">←</button>
      <span class="fc-counter">${s.fcIdx+1} / ${total}</span>
      <button class="fc-btn" ${s.fcIdx===total-1?'disabled':''} onclick="fcMove(${tabIdx},1)">→</button>
    </div>
    <div class="flashcard ${s.fcRevealed?'revealed':''}" onclick="fcReveal(${tabIdx})" id="fc-${tabIdx}">
      <div class="fc-word">${d.w}</div>
      <div class="fc-pinyin">${d.p}</div>
      <div class="fc-answer">${d.m}</div>
      <div class="fc-reveal-hint">탭하여 뜻 보기 👆</div>
    </div>
    ${s.fcRevealed ? `<div class="fc-actions">
      <button class="fc-result-btn btn-bad" onclick="fcResult(${tabIdx},'bad')">❌ 모름</button>
      <button class="fc-result-btn btn-good" onclick="fcResult(${tabIdx},'good')">✅ 알아요!</button>
    </div>` : ''}
    <div class="fc-progress">
      <span>학습 진도</span>
      <div class="fc-progress-bar"><div class="fc-progress-fill" style="width:${knownPct}%"></div></div>
      <span>${s.fcKnown.size}/${total}</span>
    </div>
  </div>`;
}

// ── FLASHCARD ACTIONS ────────────────────────────────────
function fcReveal(tabIdx) {
  tabState[tabIdx].fcRevealed = true;
  renderView(tabIdx);
}
function fcMove(tabIdx, dir) {
  const s = tabState[tabIdx];
  const data = getFiltered(tabIdx);
  s.fcIdx = Math.max(0, Math.min(data.length-1, s.fcIdx + dir));
  s.fcRevealed = false;
  renderView(tabIdx);
}
function fcResult(tabIdx, res) {
  const s = tabState[tabIdx];
  const data = getFiltered(tabIdx);
  const key = `${tabIdx}-${s.fcIdx}`;
  if (res === 'good') s.fcKnown.add(key);
  else s.fcUnknown.add(key);
  if (s.fcIdx < data.length - 1) {
    s.fcIdx++;
    s.fcRevealed = false;
  }
  renderView(tabIdx);
}

// ── HELPERS ──────────────────────────────────────────────
function setView(tabIdx, mode) {
  tabState[tabIdx].viewMode = mode;
  renderAll(tabIdx);
}
function setSort(tabIdx, sort) {
  tabState[tabIdx].sort = sort;
  renderAll(tabIdx);
}
function renderView(tabIdx) {
  const s = tabState[tabIdx];
  const el = document.getElementById(`view-${tabIdx}`);
  if (s.viewMode === 'table') el.innerHTML = renderTable(tabIdx);
  else if (s.viewMode === 'card') el.innerHTML = renderCards(tabIdx);
  else el.innerHTML = renderFlash(tabIdx);
}
function renderAll(tabIdx) {
  renderControls(tabIdx);
  renderView(tabIdx);
}

// ── TAB SWITCH ───────────────────────────────────────────
function switchTab(idx) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', i===idx));
  document.querySelectorAll('.tab-panel').forEach((p,i) => p.classList.toggle('active', i===idx));
  renderAll(idx);
  window.scrollTo({top:0, behavior:'smooth'});
}

// ── SCROLL TO TOP ────────────────────────────────────────
window.addEventListener('scroll', () => {
  document.getElementById('totop').classList.toggle('visible', window.scrollY > 300);
});

// ── INIT ─────────────────────────────────────────────────
[0,1,2,3].forEach(i => renderAll(i));
</script>
</body>
</html>
