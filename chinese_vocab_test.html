<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중국어 단어 암기 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #c0392b;       --primary-light: #fdf2f1;
  --blue:    #2563eb;       --blue-light:    #eff6ff;
  --green:   #16a34a;       --green-light:   #f0fdf4;
  --gold:    #d4a017;       --gold-light:    #fefae8;
  --purple:  #7c3aed;       --purple-light:  #f5f3ff;
  --bg:      #f8fafc;       --surface:       #fff;
  --border:  #e2e8f0;
  --text:    #0f172a;       --text-sec:      #64748b;
  --shadow:  0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14.5px;
  line-height: 1.7;
}

/* ── HEADER ── */
.page-header {
  position: sticky; top: 0; z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.header-inner { max-width: 760px; margin: 0 auto; padding: 12px 20px 0; }
.subject-label {
  font-size: 11px; font-weight: 500; letter-spacing: .08em;
  text-transform: uppercase; color: var(--text-sec); margin-bottom: 2px;
}
.page-title {
  font-size: 19px; font-weight: 700;
  display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
}
.tab-bar { display: flex; overflow-x: auto; gap: 2px; scrollbar-width: none; }
.tab-bar::-webkit-scrollbar { display: none; }
.tab-btn {
  flex-shrink: 0; display: flex; align-items: center; gap: 6px;
  padding: 8px 14px; font-size: 13px; font-weight: 500;
  color: var(--text-sec); background: none; border: none;
  border-bottom: 3px solid transparent; cursor: pointer;
  transition: color .15s; white-space: nowrap;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 700; }
.tab-num {
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--border); color: var(--text-sec);
  font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, color .15s;
}
.tab-btn.active .tab-num { background: var(--primary); color: #fff; }

/* ── CONTENT ── */
.content-wrap { max-width: 760px; margin: 0 auto; padding: 24px 20px 100px; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── MODE SELECT SCREEN ── */
.mode-screen { display: flex; flex-direction: column; gap: 14px; }
.unit-banner {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--primary-light); border: 1px solid #f5c6c2;
  border-radius: 6px; padding: 5px 12px; font-size: 12px; font-weight: 500;
  color: var(--primary); margin-bottom: 4px; width: fit-content;
}
.mode-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
.mode-card {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 12px; padding: 18px 16px; cursor: pointer;
  text-align: left; transition: all .15s; position: relative; overflow: hidden;
}
.mode-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow); }
.mode-icon { font-size: 26px; margin-bottom: 8px; }
.mode-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.mode-desc { font-size: 12px; color: var(--text-sec); line-height: 1.5; }

.direction-row { display: flex; gap: 8px; margin-top: 4px; }
.dir-btn {
  flex: 1; padding: 10px 12px; border-radius: 10px;
  border: 1.5px solid var(--border); background: var(--surface);
  font-family: 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 600;
  color: var(--text-sec); cursor: pointer; transition: all .15s;
}
.dir-btn:hover { border-color: var(--primary); color: var(--primary); }
.dir-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }

.section-label {
  font-size: 12px; font-weight: 700; color: var(--text-sec);
  text-transform: uppercase; letter-spacing: .05em; margin-top: 6px;
}

.start-btn {
  margin-top: 8px; padding: 14px; border-radius: 12px; border: none;
  background: var(--primary); color: #fff; font-family: 'Noto Sans KR', sans-serif;
  font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity .15s;
}
.start-btn:hover { opacity: .9; }
.start-btn:disabled { opacity: .4; cursor: default; }

/* ── SCOREBOARD ── */
.scoreboard {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px; gap: 10px; flex-wrap: wrap;
}
.score-chip {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 99px; padding: 5px 12px; font-size: 12px; font-weight: 600;
}
.score-chip .dot { width: 7px; height: 7px; border-radius: 50%; }
.exit-btn {
  font-size: 12px; font-weight: 600; color: var(--text-sec);
  background: none; border: 1px solid var(--border); border-radius: 8px;
  padding: 5px 10px; cursor: pointer;
}
.exit-btn:hover { color: var(--primary); border-color: var(--primary); }

/* ── PROGRESS ── */
.q-progress-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.q-progress-bar { flex: 1; height: 7px; background: var(--border); border-radius: 99px; overflow: hidden; }
.q-progress-fill { height: 100%; background: var(--primary); border-radius: 99px; transition: width .3s; }
.q-progress-label { font-size: 12px; color: var(--text-sec); font-weight: 600; white-space: nowrap; }

/* ── MC QUIZ CARD ── */
.q-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 24px 22px; box-shadow: var(--shadow);
}
.q-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.q-num { font-size: 12px; font-weight: 700; color: var(--text-sec); }
.q-difficulty {
  font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 99px;
  background: var(--blue-light); color: var(--blue);
}
.q-prompt-label {
  font-size: 11px; font-weight: 600; color: var(--text-sec);
  text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px;
}
.q-prompt {
  font-size: 30px; font-weight: 700; color: var(--primary);
  margin-bottom: 4px; letter-spacing: .02em;
}
.q-prompt.is-meaning { font-size: 19px; color: var(--text); line-height: 1.5; }
.q-prompt-sub { font-size: 14px; color: var(--blue); font-style: italic; margin-bottom: 18px; }

.mc-options { display: flex; flex-direction: column; gap: 9px; }
.mc-opt {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px;
  background: var(--surface); cursor: pointer; transition: all .12s;
  font-size: 14px; text-align: left;
}
.mc-opt:hover { border-color: var(--primary); background: var(--primary-light); }
.mc-opt-letter {
  width: 22px; height: 22px; border-radius: 50%; background: var(--border);
  color: var(--text-sec); font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.mc-opt.correct { border-color: var(--green); background: var(--green-light); }
.mc-opt.correct .mc-opt-letter { background: var(--green); color: #fff; }
.mc-opt.wrong { border-color: var(--primary); background: var(--primary-light); }
.mc-opt.wrong .mc-opt-letter { background: var(--primary); color: #fff; }
.mc-opt.disabled { cursor: default; }
.mc-opt.disabled:hover { background: var(--surface); border-color: var(--border); }
.mc-opt.correct:hover { background: var(--green-light); border-color: var(--green); }
.mc-opt.wrong:hover { background: var(--primary-light); border-color: var(--primary); }

.q-feedback {
  margin-top: 16px; padding: 12px 14px; border-radius: 10px;
  font-size: 13px; font-weight: 500; display: flex; gap: 8px; align-items: flex-start;
}
.q-feedback.correct { background: var(--green-light); color: #15803d; }
.q-feedback.wrong { background: var(--primary-light); color: var(--primary); }
.q-feedback .icon { font-size: 16px; flex-shrink: 0; }

.next-btn {
  margin-top: 16px; width: 100%; padding: 12px; border-radius: 10px; border: none;
  background: var(--text); color: #fff; font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity .15s;
}
.next-btn:hover { opacity: .85; }

/* ── FLIP CARD ── */
.flip-wrap { display: flex; flex-direction: column; align-items: center; }
.flip-card-outer {
  width: 100%; max-width: 380px; min-height: 220px; perspective: 1200px;
  cursor: pointer; margin-bottom: 18px;
}
.flip-card-inner {
  position: relative; width: 100%; height: 220px;
  transform-style: preserve-3d; transition: transform .5s;
}
.flip-card-outer.flipped .flip-card-inner { transform: rotateY(180deg); }
.flip-face {
  position: absolute; inset: 0; backface-visibility: hidden;
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,.08);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px;
}
.flip-face::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: var(--primary); border-radius: 16px 16px 0 0;
}
.flip-face-back { transform: rotateY(180deg); }
.flip-word { font-size: 40px; font-weight: 700; color: var(--primary); letter-spacing: .04em; margin-bottom: 8px; }
.flip-pinyin { font-size: 15px; color: var(--blue); font-style: italic; font-weight: 500; }
.flip-meaning { font-size: 19px; font-weight: 700; color: var(--text); text-align: center; padding: 0 10px; }
.flip-hint { font-size: 11px; color: var(--text-sec); margin-top: 14px; }

.flip-actions { display: flex; gap: 10px; width: 100%; max-width: 380px; }
.flip-result-btn {
  flex: 1; padding: 13px; border-radius: 10px; border: none;
  font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: opacity .15s; display: flex; align-items: center;
  justify-content: center; gap: 6px;
}
.flip-result-btn:hover { opacity: .85; }
.flip-result-btn:disabled { opacity: .35; cursor: default; }
.btn-know { background: var(--green); color: #fff; }
.btn-unknow { background: var(--primary); color: #fff; }

/* ── RESULT SCREEN ── */
.result-wrap { text-align: center; padding: 20px 0; }
.result-emoji { font-size: 52px; margin-bottom: 12px; }
.result-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.result-sub { font-size: 13px; color: var(--text-sec); margin-bottom: 24px; }
.result-stats {
  display: flex; justify-content: center; gap: 24px; margin-bottom: 28px;
}
.result-stat-num { font-size: 30px; font-weight: 900; }
.result-stat-label { font-size: 12px; color: var(--text-sec); margin-top: 2px; }
.result-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.result-btn {
  padding: 12px 22px; border-radius: 10px; border: none;
  font-family: 'Noto Sans KR', sans-serif; font-size: 13.5px; font-weight: 700;
  cursor: pointer; transition: opacity .15s;
}
.result-btn:hover { opacity: .88; }
.result-btn.primary { background: var(--primary); color: #fff; }
.result-btn.secondary { background: var(--border); color: var(--text); }

.review-list { margin-top: 28px; text-align: left; }
.review-title { font-size: 13px; font-weight: 700; color: var(--text-sec); margin-bottom: 10px; }
.review-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; border-radius: 8px; margin-bottom: 5px; font-size: 13px;
}
.review-item.wrong { background: var(--primary-light); }
.review-item .rw { font-weight: 700; color: var(--primary); min-width: 56px; }
.review-item .rp { color: var(--blue); font-size: 11.5px; font-style: italic; min-width: 64px; }
.review-item .rm { color: var(--text-sec); }

@media (max-width: 560px) {
  .mode-grid { grid-template-columns: 1fr; }
  .q-prompt { font-size: 26px; }
  .flip-word { font-size: 32px; }
  .result-stats { gap: 16px; }
}
</style>
</head>

    { w:'甜',     p:'tián',         m:'달다' },

  ],
};
VOCAB[3] = [...VOCAB[0], ...VOCAB[1], ...VOCAB[2]];

// ── STATE ──────────────────────────────────────────────
let currentScope = 0;
let session = null; // active quiz session object

// ── HELPERS ──────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pickN(arr, n, excludeIdx) {
  const pool = arr.map((_, i) => i).filter(i => i !== excludeIdx);
  return shuffle(pool).slice(0, n);
}

// ── BUILD MC QUESTIONS (with balanced answer distribution) ──
function buildMCQuestions(scope, direction) {
  const data = VOCAB[scope];
  let dirs = direction === 'both'
    ? data.map((_, i) => i % 2 === 0 ? 'wm' : 'mw') // word->meaning / meaning->word alternation, then shuffled
    : data.map(() => direction);

  const items = data.map((d, i) => ({ d, i, dir: dirs[i] }));
  const shuffled = shuffle(items);

  return shuffled.map((item, qi) => {
    const { d, i, dir } = item;
    const wrongIdxs = pickN(data, 3, i);
    const targetPos = qi % 4; // balance correct answer across A/B/C/D

    let optsContent;
    if (dir === 'wm') {
      optsContent = [d.m, ...wrongIdxs.map(wi => data[wi].m)];
    } else {
      optsContent = [data[i].w, ...wrongIdxs.map(wi => data[wi].w)];
    }
    // rotate so correct content lands at targetPos
    const correctContent = optsContent[0];
    const rest = optsContent.slice(1);
    const opts = [...rest];
    opts.splice(targetPos, 0, correctContent);

    return {
      dir,
      prompt: dir === 'wm' ? d.w : d.m,
      promptSub: dir === 'wm' ? d.p : null,
      opts,
      answer: targetPos,
      pinyin: d.p,
      word: d.w,
      meaning: d.m,
    };
  });
}

// ── BUILD FLIP CARDS ──
function buildFlipCards(scope, direction) {
  const data = VOCAB[scope];
  let dirs = direction === 'both'
    ? data.map((_, i) => i % 2 === 0 ? 'wm' : 'mw')
    : data.map(() => direction);
  const items = data.map((d, i) => ({ d, dir: dirs[i] }));
  return shuffle(items);
}

// ── RENDER: MODE SELECT SCREEN ──────────────────────────
function renderModeSelect() {
  const app = document.getElementById('app');
  const scopeNames = ['단어장 1 (27단어)', '단어장 2 (34단어)', '단어장 3 (37단어)', '전체 단어 (98단어)'];
  app.innerHTML = `
    <div class="mode-screen">
      <div class="unit-banner">📌 ${scopeNames[currentScope]}</div>

      <div class="section-label">퀴즈 유형 선택</div>
      <div class="mode-grid">
        <div class="mode-card" onclick="selectMode('mc')" id="mode-mc">
          <div class="mode-icon">📋</div>
          <div class="mode-name">객관식 퀴즈</div>
          <div class="mode-desc">4지선다 중 정답 고르기. 한자↔뜻 양방향 출제</div>
        </div>
        <div class="mode-card" onclick="selectMode('flip')" id="mode-flip">
          <div class="mode-icon">🃏</div>
          <div class="mode-name">카드 뒤집기</div>
          <div class="mode-desc">정답을 떠올린 뒤 카드를 뒤집어 자가채점</div>
        </div>
      </div>

      <div class="section-label">출제 방향</div>
      <div class="direction-row">
        <button class="dir-btn active" data-dir="both" onclick="selectDirection('both')">한자 ↔ 뜻 (양방향)</button>
        <button class="dir-btn" data-dir="wm" onclick="selectDirection('wm')">한자 → 뜻</button>
        <button class="dir-btn" data-dir="mw" onclick="selectDirection('mw')">뜻 → 한자</button>
      </div>

      <button class="start-btn" id="start-btn" onclick="startQuiz()" disabled>유형을 선택하세요</button>
    </div>
  `;
  window._selectedMode = null;
  window._selectedDir = 'both';
}

function selectMode(mode) {
  window._selectedMode = mode;
  document.querySelectorAll('.mode-card').forEach(c => c.style.borderColor = 'var(--border)');
  document.getElementById(`mode-${mode}`).style.borderColor = 'var(--primary)';
  const btn = document.getElementById('start-btn');
  btn.disabled = false;
  btn.textContent = mode === 'mc' ? '객관식 퀴즈 시작하기 →' : '카드 뒤집기 시작하기 →';
}

function selectDirection(dir) {
  window._selectedDir = dir;
  document.querySelectorAll('.dir-btn').forEach(b => b.classList.toggle('active', b.dataset.dir === dir));
}

function switchScope(idx) {
  currentScope = idx;
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', i===idx));
  session = null;
  renderModeSelect();
  window.scrollTo({top:0, behavior:'smooth'});
}

// ── START QUIZ ──────────────────────────────────────────
function startQuiz() {
  const mode = window._selectedMode;
  const dir = window._selectedDir;
  if (mode === 'mc') {
    session = {
      mode: 'mc',
      questions: buildMCQuestions(currentScope, dir),
      idx: 0,
      answered: false,
      selectedOpt: null,
      correctCount: 0,
      wrongList: [],
    };
    renderMC();
  } else {
    session = {
      mode: 'flip',
      cards: buildFlipCards(currentScope, dir),
      idx: 0,
      flipped: false,
      knownCount: 0,
      unknownList: [],
    };
    renderFlip();
  }
}

function exitQuiz() {
  session = null;
  renderModeSelect();
}

// ── RENDER: MC QUIZ ──────────────────────────────────────
function renderMC() {
  const app = document.getElementById('app');
  const s = session;
  const total = s.questions.length;

  if (s.idx >= total) {
    renderMCResult();
    return;
  }

  const q = s.questions[s.idx];
  const pct = Math.round((s.idx / total) * 100);
  const letters = ['A', 'B', 'C', 'D'];

  app.innerHTML = `
    <div class="scoreboard">
      <span class="score-chip"><span class="dot" style="background:var(--green)"></span>정답 ${s.correctCount}</span>
      <span class="score-chip"><span class="dot" style="background:var(--primary)"></span>오답 ${s.wrongList.length}</span>
      <button class="exit-btn" onclick="exitQuiz()">✕ 종료</button>
    </div>
    <div class="q-progress-wrap">
      <div class="q-progress-bar"><div class="q-progress-fill" style="width:${pct}%"></div></div>
      <div class="q-progress-label">${s.idx+1} / ${total}</div>
    </div>
    <div class="q-card">
      <div class="q-meta">
        <span class="q-num">문제 ${s.idx+1}</span>
        <span class="q-difficulty">${q.dir==='wm' ? '한자→뜻' : '뜻→한자'}</span>
      </div>
      <div class="q-prompt-label">${q.dir==='wm' ? '다음 한자의 뜻은?' : '다음 뜻에 알맞은 한자는?'}</div>
      <div class="q-prompt ${q.dir==='mw' ? 'is-meaning' : ''}">${q.prompt}</div>
      ${q.promptSub ? `<div class="q-prompt-sub">${q.promptSub}</div>` : '<div style="margin-bottom:18px"></div>'}
      <div class="mc-options" id="mc-opts">
        ${q.opts.map((opt, oi) => `
          <button class="mc-opt" onclick="answerMC(${oi})" data-oi="${oi}">
            <span class="mc-opt-letter">${letters[oi]}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
      <div id="mc-feedback"></div>
    </div>
  `;
}

function answerMC(oi) {
  const s = session;
  if (s.answered) return;
  s.answered = true;
  s.selectedOpt = oi;
  const q = s.questions[s.idx];
  const correct = oi === q.answer;

  if (correct) s.correctCount++;
  else s.wrongList.push(q);

  document.querySelectorAll('.mc-opt').forEach((btn, i) => {
    btn.classList.add('disabled');
    if (i === q.answer) btn.classList.add('correct');
    else if (i === oi) btn.classList.add('wrong');
  });

  const fb = document.getElementById('mc-feedback');
  fb.innerHTML = `
    <div class="q-feedback ${correct ? 'correct' : 'wrong'}">
      <span class="icon">${correct ? '✅' : '❌'}</span>
      <span>${correct ? '정답입니다!' : '오답입니다.'} <strong>${q.word}</strong> (${q.pinyin}) — ${q.meaning}</span>
    </div>
    <button class="next-btn" onclick="nextMC()">${s.idx + 1 < s.questions.length ? '다음 문제 →' : '결과 보기 →'}</button>
  `;
}

function nextMC() {
  session.idx++;
  session.answered = false;
  session.selectedOpt = null;
  renderMC();
}

function renderMCResult() {
  const app = document.getElementById('app');
  const s = session;
  const total = s.questions.length;
  const pct = Math.round((s.correctCount / total) * 100);
  let emoji = '🌱', title = '조금만 더 연습해봐요!';
  if (pct === 100) { emoji = '🏆'; title = '완벽해요!'; }
  else if (pct >= 80) { emoji = '🔥'; title = '아주 잘했어요!'; }
  else if (pct >= 60) { emoji = '👍'; title = '잘하고 있어요!'; }

  app.innerHTML = `
    <div class="q-card result-wrap">
      <div class="result-emoji">${emoji}</div>
      <div class="result-title">${title}</div>
      <div class="result-sub">${total}문제 중 ${s.correctCount}개 정답 (${pct}%)</div>
      <div class="result-stats">
        <div><div class="result-stat-num" style="color:var(--green)">${s.correctCount}</div><div class="result-stat-label">정답</div></div>
        <div><div class="result-stat-num" style="color:var(--primary)">${s.wrongList.length}</div><div class="result-stat-label">오답</div></div>
        <div><div class="result-stat-num">${pct}%</div><div class="result-stat-label">정답률</div></div>
      </div>
      <div class="result-actions">
        <button class="result-btn primary" onclick="startQuiz()">다시 풀기</button>
        <button class="result-btn secondary" onclick="exitQuiz()">유형 선택으로</button>
      </div>
      ${s.wrongList.length ? `
        <div class="review-list">
          <div class="review-title">📝 틀린 단어 복습 (${s.wrongList.length}개)</div>
          ${s.wrongList.map(q => `
            <div class="review-item wrong">
              <span class="rw">${q.word}</span>
              <span class="rp">${q.pinyin}</span>
              <span class="rm">${q.meaning}</span>
            </div>
          `).join('')}
        </div>
      ` : ''}
    </div>
  `;
}

// ── RENDER: FLIP CARD QUIZ ──────────────────────────────
function renderFlip() {
  const app = document.getElementById('app');
  const s = session;
  const total = s.cards.length;

  if (s.idx >= total) {
    renderFlipResult();
    return;
  }

  const item = s.cards[s.idx];
  const pct = Math.round((s.idx / total) * 100);
  const frontIsWord = item.dir === 'wm';

  app.innerHTML = `
    <div class="scoreboard">
      <span class="score-chip"><span class="dot" style="background:var(--green)"></span>아는 단어 ${s.knownCount}</span>
      <span class="score-chip"><span class="dot" style="background:var(--primary)"></span>모르는 단어 ${s.unknownList.length}</span>
      <button class="exit-btn" onclick="exitQuiz()">✕ 종료</button>
    </div>
    <div class="q-progress-wrap">
      <div class="q-progress-bar"><div class="q-progress-fill" style="width:${pct}%"></div></div>
      <div class="q-progress-label">${s.idx+1} / ${total}</div>
    </div>
    <div class="flip-wrap">
      <div class="flip-card-outer ${s.flipped ? 'flipped' : ''}" id="flip-outer" onclick="flipCard()">
        <div class="flip-card-inner">
          <div class="flip-face flip-face-front">
            ${frontIsWord ? `
              <div class="flip-word">${item.d.w}</div>
              <div class="flip-pinyin">${item.d.p}</div>
            ` : `
              <div class="flip-meaning">${item.d.m}</div>
            `}
            <div class="flip-hint">탭하여 정답 확인 👆</div>
          </div>
          <div class="flip-face flip-face-back">
            ${frontIsWord ? `
              <div class="flip-meaning">${item.d.m}</div>
            ` : `
              <div class="flip-word">${item.d.w}</div>
              <div class="flip-pinyin">${item.d.p}</div>
            `}
          </div>
        </div>
      </div>
      <div class="flip-actions">
        <button class="flip-result-btn btn-unknow" ${!s.flipped ? 'disabled' : ''} onclick="flipResult('unknown')">❌ 몰랐어요</button>
        <button class="flip-result-btn btn-know" ${!s.flipped ? 'disabled' : ''} onclick="flipResult('known')">✅ 알고 있었어요</button>
      </div>
    </div>
  `;
}

function flipCard() {
  session.flipped = true;
  renderFlip();
}

function flipResult(result) {
  const s = session;
  const item = s.cards[s.idx];
  if (result === 'known') s.knownCount++;
  else s.unknownList.push(item);
  s.idx++;
  s.flipped = false;
  renderFlip();
}

function renderFlipResult() {
  const app = document.getElementById('app');
  const s = session;
  const total = s.cards.length;
  const pct = Math.round((s.knownCount / total) * 100);
  let emoji = '🌱', title = '조금만 더 외워봐요!';
  if (pct === 100) { emoji = '🏆'; title = '완벽 암기!'; }
  else if (pct >= 80) { emoji = '🔥'; title = '거의 다 외웠어요!'; }
  else if (pct >= 60) { emoji = '👍'; title = '잘 외우고 있어요!'; }

  app.innerHTML = `
    <div class="q-card result-wrap">
      <div class="result-emoji">${emoji}</div>
      <div class="result-title">${title}</div>
      <div class="result-sub">${total}개 중 ${s.knownCount}개 암기 완료 (${pct}%)</div>
      <div class="result-stats">
        <div><div class="result-stat-num" style="color:var(--green)">${s.knownCount}</div><div class="result-stat-label">아는 단어</div></div>
        <div><div class="result-stat-num" style="color:var(--primary)">${s.unknownList.length}</div><div class="result-stat-label">모르는 단어</div></div>
        <div><div class="result-stat-num">${pct}%</div><div class="result-stat-label">암기율</div></div>
      </div>
      <div class="result-actions">
        <button class="result-btn primary" onclick="startQuiz()">다시 풀기</button>
        <button class="result-btn secondary" onclick="exitQuiz()">유형 선택으로</button>
      </div>
      ${s.unknownList.length ? `
        <div class="review-list">
          <div class="review-title">📝 다시 봐야 할 단어 (${s.unknownList.length}개)</div>
          ${s.unknownList.map(item => `
            <div class="review-item wrong">
              <span class="rw">${item.d.w}</span>
              <span class="rp">${item.d.p}</span>
              <span class="rm">${item.d.m}</span>
            </div>
          `).join('')}
        </div>
      ` : ''}
    </div>
  `;
}

// ── INIT ─────────────────────────────────────────────────
renderModeSelect();
</script>
