<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>통합과학 학습</title>
  <style>
    :root { color-scheme: light; font-family: Pretendard, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; padding: 24px; color: #0f172a; background: #f8fafc; }
    main { max-width: 860px; margin: 0 auto; display: grid; gap: 16px; }
    section { border: 1px solid #dbe3ef; border-radius: 18px; padding: 20px; background: #fff; box-shadow: 0 12px 28px rgba(15, 23, 42, .08); }
    h1 { margin: 0 0 8px; font-size: clamp(1.45rem, 4vw, 2.2rem); }
    h2 { margin: 0 0 10px; font-size: 1.05rem; color: #1d4ed8; }
    p, li { line-height: 1.7; }
    ul { margin: 0; padding-left: 1.2rem; }
    .badge { display: inline-flex; margin-bottom: 10px; padding: 6px 10px; border-radius: 999px; background: #dbeafe; color: #1e3a8a; font-weight: 800; font-size: .82rem; }
  </style>
</head>
<body>
  <main>
    <section>
      <span class="badge">SIMPUL STUDY</span>
      <h1>통합과학 학습</h1>
      <p>개념을 원리→사례→문제 적용 순서로 복습하세요.</p>
    </section>
    <section>
      <h2>오늘의 학습 루틴</h2>
      <ul>
        <li>단원별 핵심 용어 정의하기</li>
        <li>그래프·표에서 변인과 관계 찾기</li>
        <li>생활 속 사례와 과학 원리 연결하기</li>
      </ul>
    </section>
    <section>
      <h2>AI 문제 생성 팁</h2>
      <p>포털의 스마트 AI에서 이 과목을 선택하면 이 페이지의 핵심 텍스트를 바탕으로 연습문제를 생성합니다.</p>
    </section>
  </main>
</body>
</html>
