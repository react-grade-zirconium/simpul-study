<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simpul Study — 소설</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;min-height:100%;background:#fff7ed;color:#1f2937;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
    body{display:grid;place-items:center;padding:24px}
    .novel-card{width:min(680px,100%);border:1px solid #fed7aa;border-radius:24px;background:#fff;padding:32px;box-shadow:0 14px 36px rgba(154,52,18,.10)}
    .eyebrow{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#ffedd5;color:#c2410c;padding:7px 13px;font-size:.9rem;font-weight:800}
    h1{margin-top:16px;font-size:clamp(1.8rem,5vw,2.45rem);line-height:1.2;letter-spacing:-.045em;color:#111827}
    p{margin-top:12px;color:#64748b;line-height:1.7;font-size:1rem}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
    .button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;border-radius:14px;padding:0 16px;text-decoration:none;font-weight:900;transition:transform .15s ease,background .15s ease,border-color .15s ease}
    .button.primary{background:#ea580c;color:#fff;border:1px solid #ea580c}
    .button.secondary{background:#fff;color:#9a3412;border:1px solid #fed7aa}
    .button:hover,.button:focus-visible{transform:translateY(-2px);outline:none}
    .button.primary:hover,.button.primary:focus-visible{background:#c2410c;border-color:#c2410c}
    .button.secondary:hover,.button.secondary:focus-visible{background:#ffedd5;border-color:#fdba74}
    .note{margin-top:22px;border-radius:16px;background:#fff7ed;border:1px dashed #fdba74;padding:16px;color:#9a3412;font-size:.95rem}
  </style>
</head>
<body>
  <main class="novel-card" aria-labelledby="novelTitle">
    <span class="eyebrow">📚 공통국어 · 소설</span>
    <h1 id="novelTitle">소설 학습</h1>
    <p>인물, 사건, 배경, 갈등, 서술자와 시점 등 소설의 핵심 개념을 정리하는 공간입니다.</p>
    <p>기존에 이곳에 있던 현대소설 미니 모의고사는 별도 파트인 <strong>소설 모의고사</strong>로 옮겼습니다.</p>
    <div class="actions" aria-label="소설 관련 이동">
      <a class="button primary" href="./korean_novel_mock.html">📝 소설 모의고사로 이동</a>
      <a class="button secondary" href="./korean_hub.html">← 국어 파트 선택</a>
    </div>
    <div class="note">소설 개념 정리 자료는 이 페이지에 추가될 예정입니다.</div>
  </main>
</body>
</html>
