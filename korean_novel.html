<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공통국어 소설</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;min-height:100%;background:#fff7ed;color:#1f2937;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
    body{display:grid;place-items:center;padding:20px}
    .empty-state{width:min(560px,100%);border:1px solid #fed7aa;border-radius:22px;background:#fff;padding:30px;box-shadow:0 12px 32px rgba(124,45,18,.08);text-align:center}
    .label{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:#ffedd5;color:#c2410c;padding:7px 12px;font-size:.88rem;font-weight:800}
    h1{margin-top:14px;font-size:clamp(1.55rem,4vw,2.15rem);line-height:1.25;letter-spacing:-.04em}
    p{margin-top:8px;color:#64748b;line-height:1.55;font-size:.96rem}
    a{display:inline-flex;align-items:center;justify-content:center;margin-top:22px;min-height:48px;padding:0 18px;border:1px solid #fdba74;border-radius:999px;background:#fff7ed;color:#9a3412;text-decoration:none;font-weight:900;transition:background .15s ease,border-color .15s ease,transform .15s ease}
    a:hover,a:focus-visible{background:#ffedd5;border-color:#fb923c;transform:translateY(-2px);outline:none}
  </style>
</head>
<body>
  <main class="empty-state" aria-labelledby="novelTitle">
    <span class="label">📚 공통국어 · 소설</span>
    <h1 id="novelTitle">소설 자료 준비 중</h1>
    <p>소설 파트 학습 자료가 추가되면 이곳에서 바로 볼 수 있습니다.</p>
    <a href="./korean_hub.html">← 국어 파트 선택으로 돌아가기</a>
  </main>
</body>
</html>
