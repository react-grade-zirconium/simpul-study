<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>수학 학습 선택</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:#f6f8fc;color:#0f172a;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
    body{display:grid;place-items:center;padding:20px;overflow:auto}
    .math-select{width:min(620px,100%);border:1px solid #dbe3ef;border-radius:22px;background:#fff;padding:28px;box-shadow:0 12px 32px rgba(15,23,42,.08);text-align:center}
    .label{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:#fef3c7;color:#b45309;padding:7px 12px;font-size:.88rem;font-weight:800}
    h1{margin-top:14px;font-size:clamp(1.55rem,4vw,2.15rem);line-height:1.25;letter-spacing:-.04em}
    p{margin-top:8px;color:#64748b;line-height:1.55;font-size:.96rem}
    .ready-card{margin-top:22px;border:1px dashed #f59e0b;border-radius:18px;background:#fffbeb;padding:24px;color:#92400e;font-weight:800;line-height:1.6}
    @media (max-width:520px){body{padding:14px}.math-select{padding:22px 16px}}
  </style>
</head>
<body>
  <main class="math-select" aria-labelledby="mathTitle">
    <span class="label">📐 수학</span>
    <h1 id="mathTitle">수학 학습</h1>
    <p>수학 자료를 추가할 수 있는 학습 탭입니다.</p>

    <section class="ready-card" aria-label="수학 자료 준비 상태">
      수학 학습 자료는 준비 중입니다.<br />곧 단원별 자료를 추가할 예정입니다.
    </section>
  </main>
</body>
</html>
