<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>수학 학습 선택</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:#f6f8fc;color:#0f172a;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
    body{display:grid;place-items:center;padding:20px;overflow:auto}
    .math-select{width:min(620px,100%);border:1px solid #dbe3ef;border-radius:22px;background:#fff;padding:28px;box-shadow:0 12px 32px rgba(15,23,42,.08);text-align:center}
    .label{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:#fef3c7;color:#b45309;padding:7px 12px;font-size:.88rem;font-weight:800}
    h1{margin-top:14px;font-size:clamp(1.55rem,4vw,2.15rem);line-height:1.25;letter-spacing:-.04em}
    p{margin-top:8px;color:#64748b;line-height:1.55;font-size:.96rem}
    .choices{display:grid;grid-template-columns:1fr;gap:12px;margin-top:22px}
    .choice{display:flex;align-items:center;justify-content:center;gap:8px;min-height:74px;border:1px solid #dbe3ef;border-radius:16px;background:#f8fafc;color:#0f172a;text-decoration:none;font-size:1.18rem;font-weight:900;transition:background .15s ease,border-color .15s ease,transform .15s ease}
    .choice:hover,.choice:focus-visible{background:#fffbeb;border-color:#fbbf24;transform:translateY(-2px);outline:none}
    @media (max-width:520px){body{padding:14px}.math-select{padding:22px 16px}.choice{min-height:62px}}
  </style>
</head>
<body>
  <main class="math-select" aria-labelledby="mathTitle">
    <span class="label">📐 수학</span>
    <h1 id="mathTitle">자료를 선택하세요</h1>
    <p>수학 학습 자료를 선택해 주세요.</p>

    <nav class="choices" aria-label="수학 자료 선택">
      <a class="choice supplement" href="./math_supplement.html">📘 수학 부교재</a>
    </nav>
  </main>
</body>
</html>
