<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한국사 — 문제 풀이</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;min-height:100%;background:#f6f8fc;color:#0f172a;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
    body{display:grid;place-items:center;padding:20px}
    .page{width:min(720px,100%);border:1px solid #dbe3ef;border-radius:22px;background:#fff;padding:32px;box-shadow:0 12px 32px rgba(15,23,42,.08);text-align:center}
    .label{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:#fef2f2;color:#b91c1c;padding:7px 12px;font-size:.88rem;font-weight:800}
    h1{margin-top:14px;font-size:clamp(1.6rem,4vw,2.2rem);line-height:1.25;letter-spacing:-.04em}
    p{margin-top:10px;color:#64748b;line-height:1.6;font-size:1rem}
  </style>
</head>
<body>
  <main class="page" aria-labelledby="historyPracticeTitle">
    <span class="label">📝 한국사</span>
    <h1 id="historyPracticeTitle">문제 풀이</h1>
    <p>한국사 문제 풀이 자료를 연결할 수 있는 독립 페이지입니다.</p>
  </main>
</body>
</html>
