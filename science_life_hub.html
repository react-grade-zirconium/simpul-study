<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>통합과학 생명 학습 선택</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:#f6f8fc;color:#0f172a;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
    body{display:grid;place-items:center;padding:20px;overflow:auto}
    .life-select{width:min(620px,100%);border:1px solid #dbe3ef;border-radius:22px;background:#fff;padding:28px;box-shadow:0 12px 32px rgba(15,23,42,.08);text-align:center}
    .label{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:#f0fdf4;color:#15803d;padding:7px 12px;font-size:.88rem;font-weight:800}
    h1{margin-top:14px;font-size:clamp(1.55rem,4vw,2.15rem);line-height:1.25;letter-spacing:-.04em}
    p{margin-top:8px;color:#64748b;line-height:1.55;font-size:.96rem}
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
    .choice{display:flex;align-items:center;justify-content:center;gap:8px;min-height:74px;border:1px solid #dbe3ef;border-radius:16px;background:#f8fafc;color:#0f172a;text-decoration:none;font-size:1.18rem;font-weight:900;transition:background .15s ease,border-color .15s ease,transform .15s ease}
    .choice:hover,.choice:focus-visible{background:#f0fdf4;border-color:#86efac;transform:translateY(-2px);outline:none}
    .choice.summary:hover,.choice.summary:focus-visible{background:#ecfdf5;border-color:#6ee7b7}
    .choice.appendix:hover,.choice.appendix:focus-visible{background:#f5f3ff;border-color:#c4b5fd}
    .back{display:inline-flex;margin-top:18px;color:#2563eb;text-decoration:none;font-weight:800}
    .back:hover,.back:focus-visible{text-decoration:underline;outline:none}
    @media (max-width:520px){body{padding:14px}.life-select{padding:22px 16px}.choices{grid-template-columns:1fr}.choice{min-height:62px}}
  </style>
</head>
<body>
  <main class="life-select" aria-labelledby="lifeTitle">
    <span class="label">🧬 생명 파트</span>
    <h1 id="lifeTitle">학습할 항목을 선택하세요</h1>
    <p>생명 파트의 핵심 개념을 정리하거나 부록 자료를 바로 확인할 수 있습니다.</p>

    <nav class="choices" aria-label="생명 학습 항목 선택">
      <a class="choice summary" href="./science_life.html">📝 내용 정리</a>
      <a class="choice appendix" href="./science_life_appendix.html">📎 부록</a>
    </nav>

    <a class="back" href="./science_hub.html">← 과학 파트 선택으로 돌아가기</a>
  </main>
</body>
</html>
