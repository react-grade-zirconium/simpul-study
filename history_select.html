<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한국사 학습 선택</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:#f6f8fc;color:#0f172a;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
    body{display:grid;place-items:center;padding:20px;overflow:auto}
    .history-select{width:min(560px,100%);border:1px solid #dbe3ef;border-radius:22px;background:#fff;padding:28px;box-shadow:0 12px 32px rgba(15,23,42,.08);text-align:center}
    .label{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:#fef2f2;color:#b91c1c;padding:7px 12px;font-size:.88rem;font-weight:800}
    h1{margin-top:14px;font-size:clamp(1.55rem,4vw,2.15rem);line-height:1.25;letter-spacing:-.04em}
    p{margin-top:8px;color:#64748b;line-height:1.55;font-size:.96rem}
    .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
    .choice{display:flex;align-items:center;justify-content:center;gap:8px;min-height:74px;border:1px solid #dbe3ef;border-radius:16px;background:#f8fafc;color:#0f172a;text-decoration:none;font-size:1.18rem;font-weight:900;transition:background .15s ease,border-color .15s ease,transform .15s ease}
    .choice:hover,.choice:focus-visible{background:#fef2f2;border-color:#fca5a5;transform:translateY(-2px);outline:none}
    .choice.modern:hover,.choice.modern:focus-visible{background:#eff6ff;border-color:#93c5fd}
    .choice.practice:hover,.choice.practice:focus-visible{background:#f0fdf4;border-color:#86efac}
    @media (max-width:520px){body{padding:14px}.history-select{padding:22px 16px}.choices{grid-template-columns:1fr}.choice{min-height:62px}}
  </style>
</head>
<body>
  <main class="history-select" aria-labelledby="historyTitle">
    <span class="label">🏛️ 한국사</span>
    <h1 id="historyTitle">시대를 선택하세요</h1>

    <nav class="choices" aria-label="한국사 시대 선택">
      <a class="choice ancient" href="./history_hub.html"> 근대 이전 한국사 </a>
      <a class="choice modern" href="./history_modern.html">🚉 근대사</a>
      <a class="choice practice" href="./history_modern.html?quiz=1">📝 문제 풀이</a>
    </nav>
  </main>
</body>
</html>
